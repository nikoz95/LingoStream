version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lingostream
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://user:password@db:5432/lingostream
      - JWT_SECRET=your-secret-key-here
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data: